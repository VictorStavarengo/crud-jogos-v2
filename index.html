    <script>
      // Aplica o tema salvo (ou a preferência do sistema) antes de qualquer
      // coisa renderizar, pra não piscar um tema errado por um instante.
      // A chave 'crud-jogos:theme' precisa ser igual a THEME_STORAGE_KEY em src/constants/storageKeys.ts.
      (function () {
        try {
          var stored = localStorage.getItem('crud-jogos:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // localStorage indisponível: segue com o tema claro.
        }
      })();
    </script>
